name: Verify
on:
  pull_request:
  push:
    branches: [main, audit/security-hardening]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  lovable-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
