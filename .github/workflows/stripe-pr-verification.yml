name: Stripe PR verification

on:
  push:
    branches:
      - fix/stripe-homologation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stripe-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bunx vitest run
      - name: TypeScript check
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Production build (artifact only, not deployed)
        run: bun run build

  stripe-deno:
    name: Stripe mocked webhook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno webhook tests
        run: deno test --allow-env --node-modules-dir=none supabase/tests/stripe_flows_test.ts
